<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OfflinePay - Dashboard</title>
    <Link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
   <div class="app-container">
       <div class="top-bar">
           <div>
               <p class="greeting">Welcome back,</p>
               <h2 th:text="${account.name}">Name</h2>
           </div>
           <a th:href="@{/logout}" class="logout-link">Log out</a>
       </div>

       <div id="status-badge" class="status-badge online">
           <span class="dot"></span>
           <span id="status-text">Online</span>
       </div>

       <div class="balance-card">
           <p class="balance-label">Available Balance</p>
           <h1 class="balance-amount"
               th:text="'₦' + ${#numbers.formatDecimal(account.balance,1 , 'COMMA', 2, 'POINT')}">₦0.00</h1>
           <p class="balance-owner" th:text="${account.email}">email</p>
       </div>

       <div class="actions">
           <a th:href="@{/send}" class="action-btn">
               <span class="action-icon">↗</span>
               <span>Send Money</span>
           </a>
           <a th:href="@{/history}" class="action-btn">
               <span class="action-icon">☰</span>
               <span>History</span>
           </a>
       </div>

       <div class="section-header">
           <h3>Recent Transactions</h3>
       </div>

       <div class="empty-state" th:if="${#lists.isEmpty(transactions)}">
           No transactions yet.
       </div>

       <div class="tx-list" th:unless="${#lists.isEmpty(transactions}}">
           <div class="tx-row" th:each="t : ${transactions}">
               <div class="tx-info">
                   <p class="tx-title"
                      th:text="${t.senderId == account.id} ? 'Sent to account #' + ${t.receiverId} : 'Received from account #' + ${t.senderId}">Title</p>
                   <p class="tx-date" th:text="${#temporals.format(t.timestamp, 'dd MMM yyyy, HH:mm')}">Date</p>
               </div>
               <div class="tx-right">
                   <p class="tx-amount"
                      th:text="(${t.senderId == account.id} ? '-' : '+') + '₦' + ${#numbers.formatDecimal(t.amount, 1, 'COMMA', 2, 'POINT')}">Amount</p>
                   <span class="badge"
                         th:classappend="'badge-' + ${t.status}"
                         th:text="${#strings.replace(t.status.name(), '_', ' ')}">STATUS</span>
               </div>
           </div>
       </div>
   </div>

    <nav class="bottom-nav">
        <a th:href="@{/dashboard}" class="active">Home</a>
        <a th:href="@{/send}">Send</a>
        <a th:href="@{/history}">History</a>
    </nav>

    <script>
        function updateStatus() {
            const badge = document.getElementById('status-badge');
            const text = document.getElementById('status-text');
            if (navigator.online) {
                badge.className = 'status-badge online';
                text.textContent = 'Online';
            }else {
               badge.className = 'status-badge offline';
               text.textContent = 'Offline Mode';
            }
        }
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
    </script>

</body>
</html>
