<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OfflinePay - Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
   <div class="app-container">
       <div class="top-bar">
           <div>
               <p class="greeting">Welcome back,</p>
               <h2 th:text="'Hi, ' + ${firstName}">Hi, Name</h2>
           </div>
           <a th:href="@{/logout}" class="logout-link">Log out</a>
       </div>

       <div id="status-badge" class="status-badge online">
           <span class="dot"></span>
           <span id="status-text">Online</span>
       </div>

       <div class="balance-card">
           <div class="balance-top">
               <p class="balance-label">Available Balance</p>
               <button type="button" class="eye-btn" id="balance-eye" onclick="toggleBalance()" aria-label="Show or hide balance">
                   <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                       <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                       <circle cx="12" cy="12" r="3"/>
                   </svg>
                   <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                       <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                       <line x1="1" y1="1" x2="23" y2="23"/>
                   </svg>
               </button>
           </div>

           <h1 class="balance-amount" id="balance-amount"
               th:data-amount="'₦' + ${#numbers.formatDecimal(account.balance, 1, 'COMMA', 2, 'POINT')}">****</h1>
       </div>

       <div class="actions">
           <a th:href="@{/send}" class="action-btn">
               <span class="action-icon">↗</span>
               <span>Send Money</span>
           </a>
           <a th:href="@{/history}" class="action-btn">
               <span class="action-icon">☰</span>
               <span>History</span>
           </a>
           <a th:href="@{/add-money}" class="action-btn">
               <span class="action-icon">+</span>
               <span>Add Money</span>
           </a>
       </div>

       <div class="section-header">
           <h3>Recent Transactions</h3>
       </div>

       <div class="empty-state" th:if="${#lists.isEmpty(transactions)}">
           No transactions yet.
       </div>

       <div class="tx-list" th:unless="${#lists.isEmpty(transactions)}">
           <div class="tx-row" th:each="t : ${transactions}">
               <div class="tx-info">
                   <p class="tx-title"
                      th:text="${t.senderId == account.id} ? 'Sent to account #' + ${t.receiverId} : 'Received from account #' + ${t.senderId}">Title</p>
                   <p class="tx-date" th:text="${#temporals.format(t.timestamp, 'dd MMM yyyy, HH:mm')}">Date</p>
               </div>
               <div class="tx-right">
                   <p class="tx-amount"
                      th:text="(${t.senderId == account.id} ? '-' : '+') + '₦' + ${#numbers.formatDecimal(t.amount, 1, 'COMMA', 2, 'POINT')}">Amount</p>
                   <span class="badge"
                         th:classappend="'badge-' + ${t.status}"
                         th:text="${#strings.replace(t.status.name(), '_', ' ')}">STATUS</span>
               </div>
           </div>
       </div>
   </div>

    <nav class="bottom-nav">
        <a th:href="@{/dashboard}" class="active">Home</a>
        <a th:href="@{/send}">Send</a>
        <a th:href="@{/history}">History</a>
    </nav>

    <script>
        function updateStatus() {
            const badge = document.getElementById('status-badge');
            const text = document.getElementById('status-text');
            if (navigator.onLine) {
                badge.className = 'status-badge online';
                text.textContent = 'Online';
            }else {
               badge.className = 'status-badge offline';
               text.textContent = 'Offline Mode';
            }
        }
        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();

        function applyBalance(show) {
            const amount = document.getElementById('balance-amount');
            const eye = document.getElementById('balance-eye');
            amount.textContent = show ? amount.dataset.amount : '****';
            eye.classList.toggle('revealed', show);
        }

        function toggleBalance() {
            const showing = document.getElementById('balance-eye').classList.contains('revealed');
            localStorage.setItem('balanceVisible', !showing);
            applyBalance(!showing);
        }

        applyBalance(localStorage.getItem('balanceVisible') === 'true');
    </script>

</body>
</html>
