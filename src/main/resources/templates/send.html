<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Send money - OfflinePay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#5B21B6">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script th:src="@{/js/pwa.js}" defer></script>
    <script th:src="@{/js/net.js}" defer></script>
    <script th:src="@{/js/send.js}" defer></script>
    <script th:src="@{/js/theme.js}"></script>
</head>
<body th:attr="data-account-id=${accountId},data-online-fee=${onlineFee},data-offline-fee=${offlineFee}">
<main class="op-page">

    <div class="op-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>Send money</strong>
            <span id="netBadge" class="op-hint"></span>
        </div>
        <label class="op-switch">
            <input type="checkbox" id="simulate"> Simulate offline (for the demo)
        </label>
    </div>

    <div class="op-tabs">
        <button type="button" class="op-tab active">To OfflinePay</button>
        <button type="button" class="op-tab" id="tabBank">To other banks</button>
    </div>

    <form id="sendForm" class="op-card" novalidate>
        <div class="op-field">
            <label for="receiverAccount">Account number</label>
            <input type="text" id="receiverAccount" inputmode="numeric" maxlength="10"
                   autocomplete="off" placeholder="10-digit account number">
            <small id="nameLine" class="op-hint"></small>
        </div>

        <div class="op-field">
            <label for="amount">Amount (₦)</label>
            <input type="text" id="amount" inputmode="decimal" autocomplete="off" placeholder="0.00">
            <small id="feeLine" class="op-hint"></small>
        </div>

        <div class="op-field" id="pinRow">
            <label for="pin">Transaction PIN</label>
            <div class="password-wrapper">
                <input type="password" id="pin" inputmode="numeric" maxlength="4" autocomplete="off">
                <button type="button" class="toggle-password" onclick="togglePassword(this)" aria-label="Show or hide PIN">
                    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>
        </div>

        <p id="modeNote" class="op-hint"></p>
        <p id="status" role="status" style="display:none"></p>
        <button type="submit" class="op-btn">Send</button>
    </form>

    <div class="op-card" id="queueCard" style="display:none">
        <strong>Waiting to send</strong>
        <ul id="queueList" class="op-queue"></ul>

        <div id="flushBox" style="display:none">
            <div class="op-field">
                <label for="flushPin">You're back online. Enter your PIN to send them</label>
                <div class="password-wrapper">
                    <input type="password" id="flushPin" inputmode="numeric" maxlength="4" autocomplete="off">
                    <button type="button" class="toggle-password" onclick="togglePassword(this)" aria-label="Show or hide PIN">
                        <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>
            <p id="flushStatus" role="status" style="display:none"></p>
            <button type="button" id="flushBtn" class="op-btn">Send waiting transfers</button>
        </div>
    </div>

</main>

<nav class="bottom-nav">
    <a th:href="@{/dashboard}">Home</a>
    <a th:href="@{/send}" class="active">Send</a>
    <a th:href="@{/history}">History</a>
</nav>

<div id="bankModal" class="modal" style="display:none">
    <div class="modal-box">
        <h3>Bank transfers: coming soon</h3>
        <p>Our money is still learning the way to other banks. For now, sending to another OfflinePay user works, even without internet.</p>
        <button type="button" id="bankClose" class="op-btn">Got it</button>
    </div>
</div>

<script>
    function togglePassword(button) {
        const input = button.parentElement.querySelector('input');
        const isShowing = input.type === 'text';
        input.type = isShowing ? 'password' : 'text';
        button.classList.toggle('visible', !isShowing);
    }
</script>
</body>
</html>
