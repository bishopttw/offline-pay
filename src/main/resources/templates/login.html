<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OfflinePay -Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#5B21B6">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script th:src="@{/js/pwa.js}" defer></script>
</head>
<body>
   <div class="auth-container">
       <div class="auth-card">
           <h1>OfflinePay</h1>
           <p class="subtitle">Welcome back</p>

           <div class="error-message" th:if="${error}" th:text="${error}"></div>

           <form th:action="@{/login}" method="post">
               <div class="form-group">
                   <label>Email</label>
                   <input type="email" name="email" required>
               </div>

               <div class="form-group">
                   <label>Password</label>
                   <div class="password-wrapper">
                       <input type="password" name="password" required>
                       <button type="button" class="toggle-password" onclick="togglePassword(this)" aria-label="Show or hide password">
                           <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                               <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                               <circle cx="12" cy="12" r="3"/>
                           </svg>
                           <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                               <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                               <line x1="1" y1="1" x2="23" y2="23"/>
                           </svg>
                       </button>
                   </div>
               </div>
               <button type="submit" class="btn-primary">Log In</button>
           </form>

           <p class="auth-switch">New here? <a th:href="@{/signup}">Sign up</a></p>
       </div>
   </div>

   <script>
       function togglePassword(button) {
           const input = button.parentElement.querySelector('input');
           const isShowing = input.type === 'text';
           input.type = isShowing ? 'password' : 'text';
           button.classList.toggle('visible', !isShowing);
       }
   </script>

</body>
</html>
