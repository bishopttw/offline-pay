spring.application.name=offlinepay
spring.datasource.url=jdbc:h2:file:./data/offlinepay
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=https://api.paystack.co
app.base-url=${APP_BASE_URL:http://localhost:8080}

server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.h2.console.enabled=${H2_CONSOLE:false}